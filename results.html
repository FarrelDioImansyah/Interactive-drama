<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Weakling - Hasil Voting</title>
  <link rel="stylesheet" href="css/mafia-theme.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 2rem 2.5rem;
    }

    /* PROYEKTOR: padding lebih besar, teks lebih besar */
    @media (min-width: 900px) {
      body { padding: 3rem 4rem; }
    }

    /* HEADER */
    .results-header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      gap: 2rem;
      border-bottom: 1px solid var(--border);
      padding-bottom: 1.5rem;
      margin-bottom: 2rem;
    }

    .show-title {
      font-family: var(--font-title);
      font-size: clamp(1.5rem, 4vw, 2.5rem);
      font-weight: 800;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-hi);
      line-height: 1;
    }

    .show-subtitle {
      font-size: 0.8rem;
      color: var(--text-lo);
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-top: 0.375rem;
    }

    .header-right {
      text-align: right;
      flex-shrink: 0;
    }

    .total-count {
      font-family: var(--font-title);
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 800;
      color: var(--text-hi);
      line-height: 1;
    }

    .total-label {
      font-size: 0.7rem;
      color: var(--text-lo);
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-top: 0.25rem;
    }

    /* PERTANYAAN PANGGUNG */
    .stage-question-wrap {
      margin-bottom: 2rem;
    }

    .stage-scene-tag {
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: #C03040;
      margin-bottom: 0.625rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .stage-scene-tag .live-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--maroon-bright);
      animation: breathe 2s ease-in-out infinite;
    }

    .projector-question {
      font-size: clamp(1.375rem, 3.5vw, 2.5rem);
      line-height: 1.25;
    }

    /* HASIL BAR CARDS */
    .result-cards {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      flex: 1;
    }

    .result-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--r-lg);
      padding: 1.25rem 1.5rem;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
      gap: 1.5rem;
    }

    .result-card.winner {
      border-color: var(--maroon-bright);
    }

    /* Background bar fill (posisi absolute di belakang konten) */
    .result-bar-bg {
      position: absolute;
      inset-y: 0;
      left: 0;
      background: rgba(139, 0, 0, 0.18);
      transition: width 0.65s cubic-bezier(0.16, 1, 0.3, 1);
      border-right: 2px solid rgba(160, 16, 32, 0.5);
    }

    .result-card.winner .result-bar-bg {
      background: rgba(139, 0, 0, 0.28);
      border-right-color: var(--maroon-bright);
      /* Hanya elemen pemenang yang dapat glow (R-13) */
      box-shadow: inset -6px 0 20px rgba(160, 16, 32, 0.35);
    }

    .result-card-content {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      gap: 1.5rem;
    }

    .result-code {
      width: 48px;
      height: 48px;
      flex-shrink: 0;
      border-radius: var(--r-md);
      background: rgba(240, 237, 232, 0.06);
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: var(--font-title);
      font-weight: 700;
      font-size: 1.25rem;
      color: var(--text-mid);
    }

    .result-card.winner .result-code {
      background: var(--maroon-bright);
      border-color: var(--maroon-bright);
      color: #fff;
    }

    .result-info {
      flex: 1;
    }

    .result-label {
      font-size: clamp(1rem, 2.5vw, 1.375rem);
      font-weight: 700;
      color: var(--text-hi);
      line-height: 1.2;
    }

    .result-desc {
      font-size: 0.8rem;
      color: var(--text-lo);
      margin-top: 0.25rem;
    }

    .result-winner-tag {
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #E07080;
      background: var(--maroon-dim);
      border: 1px solid var(--border-active);
      border-radius: var(--r-sm);
      padding: 0.15rem 0.5rem;
      margin-left: 0.625rem;
    }

    .result-pct {
      font-family: var(--font-title);
      font-size: clamp(2rem, 5vw, 3.5rem);
      font-weight: 800;
      color: var(--text-hi);
      line-height: 1;
      flex-shrink: 0;
      text-align: right;
    }

    .result-card.winner .result-pct {
      color: #F0EDE8;
    }

    .result-count {
      font-size: 0.75rem;
      color: var(--text-lo);
      text-align: right;
      margin-top: 0.2rem;
    }

    /* WINNER BANNER (ditampilkan saat voting ditutup) */
    .winner-banner {
      margin-top: 1.75rem;
      padding: 1.25rem 1.5rem;
      background: var(--surface-raised);
      border: 1px solid var(--maroon-bright);
      border-radius: var(--r-lg);
      display: none;
    }

    .winner-banner-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #E07080;
      margin-bottom: 0.5rem;
    }

    .winner-banner-title {
      font-family: var(--font-title);
      font-size: clamp(1.25rem, 3vw, 2rem);
      font-weight: 800;
      color: var(--text-hi);
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    .winner-banner-sub {
      font-size: 0.85rem;
      color: var(--text-mid);
      margin-top: 0.375rem;
    }

    /* FOOTER */
    .results-footer {
      border-top: 1px solid var(--border);
      padding-top: 1.25rem;
      margin-top: 2rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 0.75rem;
    }

    .results-footer p {
      font-size: 0.72rem;
      color: var(--text-lo);
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>

  <!-- HEADER LAYAR PROYEKTOR -->
  <header class="results-header">
    <div>
      <h1 class="show-title" id="showTitleEl">The Weakling</h1>
      <p class="show-subtitle" id="statusLabelEl">Memuat status sesi...</p>
    </div>

    <div class="header-right">
      <div class="total-count" id="totalEl">0</div>
      <div class="total-label">Suara Masuk</div>
      <div style="margin-top: 0.75rem;">
        <span id="statusBadgeEl" class="badge badge-closed">Memuat...</span>
      </div>
    </div>
  </header>

  <!-- PERTANYAAN BESAR PANGGUNG -->
  <div class="stage-question-wrap">
    <div class="stage-scene-tag">
      <span class="live-dot" id="liveDot"></span>
      <span id="sceneTagEl">SCENE 2</span>
    </div>
    <h2 class="projector-question title-scene" id="questionEl">Memuat pertanyaan sesi...</h2>
  </div>

  <!-- HASIL VOTING BARS -->
  <div class="result-cards" id="resultCards"></div>

  <!-- WINNER BANNER (saat closed) -->
  <div class="winner-banner" id="winnerBanner">
    <p class="winner-banner-label">Hasil Terpilih</p>
    <h3 class="winner-banner-title" id="winnerTitleEl">...</h3>
    <p class="winner-banner-sub" id="winnerSubEl">...</p>
  </div>

  <!-- FOOTER -->
  <footer class="results-footer">
    <p>THE WEAKLING &bull; PENTAS SENI TEATER</p>
    <p id="realtimeEl">
      <span style="display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--maroon-bright); margin-right: 5px; animation: breathe 2s infinite;"></span>
      Sinkronisasi realtime aktif
    </p>
  </footer>

  <script src="js/mafia-engine.js"></script>
  <script>
    const showTitleEl = document.getElementById('showTitleEl');
    const statusLabelEl = document.getElementById('statusLabelEl');
    const statusBadgeEl = document.getElementById('statusBadgeEl');
    const totalEl = document.getElementById('totalEl');
    const sceneTagEl = document.getElementById('sceneTagEl');
    const liveDot = document.getElementById('liveDot');
    const questionEl = document.getElementById('questionEl');
    const resultCards = document.getElementById('resultCards');
    const winnerBanner = document.getElementById('winnerBanner');
    const winnerTitleEl = document.getElementById('winnerTitleEl');
    const winnerSubEl = document.getElementById('winnerSubEl');

    window.mafiaEngine.subscribe((state) => {
      showTitleEl.textContent = state.show.title || 'The Weakling';

      let activePoll = state.polls.find(p => p.status === 'open');
      const isLive = !!activePoll;

      if (!activePoll) {
        activePoll = state.polls.find(p => p.status === 'closed') || state.polls[0];
      }
      if (!activePoll) return;

      const calc = window.mafiaEngine.getPollResults(activePoll.id);
      if (!calc) return;

      // Update header
      totalEl.textContent = calc.totalVotes;
      sceneTagEl.textContent = `SCENE ${activePoll.scene} — ${activePoll.title.toUpperCase()}`;

      // Status
      if (activePoll.status === 'open') {
        statusLabelEl.textContent = 'Voting sedang berlangsung';
        statusBadgeEl.className = 'badge badge-live';
        statusBadgeEl.innerHTML = '<span class="dot-live"></span> LIVE';
        liveDot.style.display = '';
        winnerBanner.style.display = 'none';
      } else if (activePoll.status === 'closed') {
        statusLabelEl.textContent = 'Sesi ini telah ditutup';
        statusBadgeEl.className = 'badge badge-closed';
        statusBadgeEl.textContent = 'SELESAI';
        liveDot.style.display = 'none';

        // Winner banner
        winnerBanner.style.display = 'block';
        if (calc.isTie) {
          winnerTitleEl.textContent = 'HASIL SERI';
          winnerSubEl.textContent = 'Keputusan akhir diserahkan kepada sutradara panggung.';
        } else if (calc.winner) {
          winnerTitleEl.textContent = `[${calc.winner.code}] ${calc.winner.label.toUpperCase()}`;
          const suffix = activePoll.scene === 4
            ? `Ending resmi terpilih dengan ${calc.winner.percentage}% suara.`
            : `Adegan dilanjutkan sesuai pilihan mayoritas (${calc.winner.count} suara / ${calc.winner.percentage}%).`;
          winnerSubEl.textContent = suffix;
        } else {
          winnerTitleEl.textContent = 'TIDAK ADA SUARA';
          winnerSubEl.textContent = 'Voting ditutup tanpa suara penonton masuk.';
        }
      } else {
        statusLabelEl.textContent = 'Sesi belum dibuka';
        statusBadgeEl.className = 'badge badge-draft';
        statusBadgeEl.textContent = 'DRAFT';
        liveDot.style.display = 'none';
        winnerBanner.style.display = 'none';
      }

      questionEl.textContent = activePoll.question;

      // Render result cards
      resultCards.innerHTML = '';
      calc.options.forEach(opt => {
        const isWin = !isLive && calc.winner && calc.winner.id === opt.id;

        const card = document.createElement('div');
        card.className = 'result-card' + (isWin ? ' winner' : '');

        card.innerHTML = `
          <div class="result-bar-bg" style="width: ${opt.percentage}%;"></div>
          <div class="result-card-content">
            <div class="result-code">${opt.code}</div>
            <div class="result-info">
              <div class="result-label">
                ${opt.label}
                ${isWin ? '<span class="result-winner-tag">Terpilih</span>' : ''}
              </div>
              ${opt.desc ? `<div class="result-desc">${opt.desc}</div>` : ''}
            </div>
            <div>
              <div class="result-pct">${opt.percentage}<span style="font-size: 0.45em; font-weight: 600; opacity: 0.8;">%</span></div>
              <div class="result-count">${opt.count} suara</div>
            </div>
          </div>
        `;
        resultCards.appendChild(card);
      });
    });
  </script>
</body>
</html>
