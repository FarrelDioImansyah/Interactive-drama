<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Weakling - Tiket Penonton</title>
  <link rel="stylesheet" href="css/mafia-theme.css">
  <style>
    body {
      min-height: 100svh;
      display: flex;
      flex-direction: column;
    }

    .login-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem;
    }

    .login-card {
      width: 100%;
      max-width: 360px;
    }

    .brand-mark {
      text-align: center;
      margin-bottom: 2rem;
    }

    .brand-mark .icon-wrap {
      width: 52px;
      height: 52px;
      border-radius: 6px;
      border: 1px solid rgba(139, 0, 0, 0.5);
      background: rgba(139, 0, 0, 0.12);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 1rem;
    }

    .brand-mark .icon-wrap svg {
      width: 24px;
      height: 24px;
      color: #C0304050; /* merah marun, bukan icon generik */
      stroke: #C03040;
      fill: none;
      stroke-width: 1.5;
    }

    .field-group {
      margin-bottom: 1.125rem;
    }

    .field-label {
      display: block;
      font-size: 0.75rem;
      font-weight: 600;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-lo);
      margin-bottom: 0.5rem;
    }

    .field-hint {
      font-size: 0.7rem;
      color: var(--text-lo);
      margin-top: 0.375rem;
    }

    .page-footer {
      text-align: center;
      padding: 1rem;
      font-size: 0.7rem;
      color: var(--text-lo);
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>

  <div class="login-wrap">
    <div class="login-card">

      <div class="brand-mark">
        <div class="icon-wrap">
          <!-- Ikon topeng/teater, relevan dengan drama (R-04) -->
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M2 4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v6c0 2.5-2 5-6 5S2 12.5 2 10V4z" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M14 6h6a2 2 0 0 1 2 2v4c0 2-1.5 4.5-5 4.5" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M7 8h2M7 11c0 .8.9 1.5 2 1.5s2-.7 2-1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </div>

        <h1 class="title-stage" style="font-size: 1.25rem; margin-bottom: 0.375rem;">THE WEAKLING</h1>
        <p class="label-mono" style="margin-bottom: 0.375rem;">Dewan Penonton</p>
        <p style="font-size: 0.8rem; color: var(--text-lo);">Masukkan nama untuk mengambil 1 hak suara.</p>
      </div>

      <div class="panel-elevated" style="padding: 1.5rem;">
        <form id="audienceLoginForm">
          <div class="field-group">
            <label class="field-label" for="audienceNameInput">Nama Panggilan</label>
            <input
              type="text"
              id="audienceNameInput"
              class="input"
              placeholder="Contoh: Radit, Vino, Anggota 07..."
              autocomplete="off"
              required
            >
            <p class="field-hint">1 perangkat = 1 hak suara per sesi.</p>
          </div>

          <button type="submit" class="btn btn-primary" style="width: 100%;">
            Masuk dan Pilih
          </button>
        </form>
      </div>

    </div>
  </div>

  <footer class="page-footer">
    Pentas Seni Teater &bull; The Weakling
  </footer>

  <script src="js/mafia-engine.js"></script>
  <script>
    const form = document.getElementById('audienceLoginForm');
    const nameInput = document.getElementById('audienceNameInput');

    const saved = localStorage.getItem('MAFIA_AUDIENCE_NAME');
    if (saved) nameInput.value = saved;

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = nameInput.value.trim();
      if (!name) return;

      localStorage.setItem('MAFIA_AUDIENCE_NAME', name);
      window.mafiaEngine.getVoterToken();
      window.location.href = 'vote.html';
    });
  </script>
</body>
</html>
